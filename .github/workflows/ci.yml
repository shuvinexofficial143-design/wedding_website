name: Validate wedding website
on:
  push:
    branches: [main, development]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-card-visuals
          path: |
            test-results/premium-*.png
            test-results/art-*.png
            test-results/studio-*.png
            test-results/motion-*.png
            test-results/website-*.png
          if-no-files-found: ignore
          retention-days: 7
